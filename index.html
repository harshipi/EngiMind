<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>EngiMind - Student OS</title>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" integrity="sha384-n8MVd4RsNIU0tAv4ct0nTaAbDJwPJzDEaqSD1odI+WdtXRGWt2kTvGFasHpSy3SV" crossorigin="anonymous">
    <style>
      :root {
        --ios-bg: #F8FAFC; /* Slate-50 */
        --ios-card: #FFFFFF;
        --ios-text: #1E293B; /* Slate-800 */
        --primary: #4F46E5; /* Indigo-600 */
        --safe-top: env(safe-area-inset-top);
        --safe-bottom: env(safe-area-inset-bottom);
      }
      
      .dark {
        --ios-bg: #000000;
        --ios-card: #1C1C1E;
        --ios-text: #F5F5F7;
      }

      body {
        /* SF Pro Stack */
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
        background-color: var(--ios-bg);
        color: var(--ios-text);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        transition: background-color 0.4s cubic-bezier(0.25, 0.8, 0.25, 1), color 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        overflow-x: hidden;
      }

      /* iOS Glassmorphism - Refined */
      .glass {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(20px) saturate(180%);
        -webkit-backdrop-filter: blur(20px) saturate(180%);
        border-bottom: 0.5px solid rgba(0, 0, 0, 0.05);
      }
      .dark .glass {
        background: rgba(28, 28, 30, 0.85);
        border-bottom: 0.5px solid rgba(255, 255, 255, 0.1);
      }

      .glass-top {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(20px) saturate(180%);
        -webkit-backdrop-filter: blur(20px) saturate(180%);
        border-top: 0.5px solid rgba(0, 0, 0, 0.05);
      }
      .dark .glass-top {
        background: rgba(28, 28, 30, 0.85);
        border-top: 0.5px solid rgba(255, 255, 255, 0.1);
      }

      .ios-card {
        background-color: var(--ios-card);
        border-radius: 24px; /* Slightly more rounded */
        box-shadow: 0 10px 40px -10px rgba(0,0,0,0.05);
        transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1), box-shadow 0.3s ease;
        border: 0.5px solid rgba(0,0,0,0.04);
      }
      .dark .ios-card {
        border: 0.5px solid rgba(255,255,255,0.08);
        box-shadow: none;
      }
      
      .ios-btn {
        transition: all 0.2s cubic-bezier(0.25, 0.1, 0.25, 1);
      }
      .ios-btn:active {
        transform: scale(0.96);
      }

      /* Safe Area Utilities */
      .pb-safe { padding-bottom: var(--safe-bottom); }
      .pt-safe { padding-top: var(--safe-top); }
      .mb-safe { margin-bottom: var(--safe-bottom); }

      /* No Scrollbar Utility */
      .no-scrollbar::-webkit-scrollbar {
          display: none;
      }
      .no-scrollbar {
          -ms-overflow-style: none;
          scrollbar-width: none;
      }

      /* Animations */
      @keyframes slideInUp {
        from { opacity: 0; transform: translateY(40px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-slide-up {
        animation: slideInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        opacity: 0;
      }
      
      @keyframes scaleIn {
        from { opacity: 0; transform: scale(0.96); }
        to { opacity: 1; transform: scale(1); }
      }
      .animate-scale-in {
        animation: scaleIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        opacity: 0;
      }

      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      .animate-fade-in {
        animation: fadeIn 0.4s ease-out forwards;
      }
      
      @keyframes slideInRight {
        from { transform: translateX(100%); }
        to { transform: translateX(0); }
      }
      .animate-slide-in-right {
        animation: slideInRight 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      @keyframes widthExpand {
        from { width: 0%; left: 50%; }
        to { width: 100%; left: 0%; }
      }
      .animate-width-expand {
        animation: widthExpand 0.3s cubic-bezier(0.2, 0, 0, 1) forwards;
      }

      /* Scrollbar */
      ::-webkit-scrollbar { width: 0px; background: transparent; }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "lucide-react": "https://esm.sh/lucide-react@^0.561.0",
    "react-markdown": "https://esm.sh/react-markdown@^10.1.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.33.0",
    "remark-math": "https://esm.sh/remark-math@^6.0.0",
    "rehype-katex": "https://esm.sh/rehype-katex@^7.0.0"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
  </body>
</html>
